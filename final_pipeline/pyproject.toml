[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-screening"
version = "0.1.0"
description = "Transaction fraud risk screening pipeline"
requires-python = ">=3.11"
dependencies = [
    "joblib",
    "numpy",
    "scikit-learn==1.9.1",
    "scipy",
    "pandas==3.0.5",
]

[tool.setuptools.packages.find]
where = ["src"]
